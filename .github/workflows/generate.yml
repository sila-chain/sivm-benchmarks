name: generate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test sivmbench.py
        run: |
          pip install -r requirements.txt
          python sivmbench_test.py

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install retesteth build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev libboost-filesystem-dev libboost-program-options-dev libboost-system-dev

      - name: Build sivm
        run: make bin/sivm && bin/sivm -v

      - name: Restore retesteth build
        id: retesteth-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/retesteth
          key: retesteth-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build retesteth
        if: steps.retesteth-cache.outputs.cache-hit != 'true'
        run: make bin/retesteth

      - name: Save retesteth build
        if: steps.retesteth-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bin/retesteth
          key: retesteth-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Generate micro/signextend with the Sila config
        run: |
          export PATH="$PWD/bin:$PATH"
          retesteth --version
          rm -rf tmp && mkdir -p tmp/micro
          ./sivmbench.py build-source src/micro/signextend.yml -o tmp/micro/signextendFiller.yml
          retesteth -t GeneralStateTests -- --datadir retesteth-config --testpath . --filltests --forceupdate --clients t8ntool --testfile tmp/micro/signextendFiller.yml --outfile tmp/micro/signextend.json 2>&1 | tee tmp/micro.log
          if grep -q 'Error' tmp/micro.log; then echo "retesteth reported errors"; exit 1; fi
          python - <<'PY'
          import json
          d = json.load(open("tmp/micro/signextend.json"))
          t = d["signextend"]
          assert list(t["post"]) == ["SilaLondon"], list(t["post"])
          assert len(t["post"]["SilaLondon"]) > 0
          assert t["_info"]["filling-rpc-server"].startswith("sivm version"), t["_info"]
          print("micro OK:", len(t["post"]["SilaLondon"]), "post entries;", t["_info"]["filling-rpc-server"])
          PY

      - name: Generate benchmarks
        run: |
          export PATH="$PWD/bin:$PATH"
          make clean
          make
          python - <<'PY'
          import glob, json
          files = sorted(glob.glob("benchmarks/*/*.json"))
          assert len(files) == 14, files
          for f in files:
              d = json.load(open(f))
              assert len(d) == 1, f
              (name, t), = d.items()
              assert list(t["post"]) == ["SilaLondon"], (f, list(t["post"]))
              assert len(t["post"]["SilaLondon"]) > 0, f
              assert t["_info"]["filling-rpc-server"].startswith("sivm version"), (f, t["_info"])
              print(f, name, len(t["post"]["SilaLondon"]), "post entries")
          PY
          git status --short
          git diff --stat

      - name: Publish generated benchmarks
        if: github.event_name != 'pull_request'
        run: |
          branch="generated/${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add benchmarks
          git commit -m "benchmarks: regenerate for SilaLondon

          Generated by the generate workflow (run ${GITHUB_RUN_ID}) from ${GITHUB_SHA}
          with sivmbench.py, retesteth and go-sila sivm."
          git push origin "$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated
          path: |
            benchmarks/
            tmp/*.log
            tmp/micro/
          if-no-files-found: ignore
